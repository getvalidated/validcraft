<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Validcraft</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-15 -16 30 29' stroke-width='1.4' stroke-linejoin='round' stroke='%238FA3D6' fill='%238FA3D6'%3E%3Cpath d='M12.2 11V-5' fill='none'/%3E%3Ccircle cx='12.2' cy='-7.4' r='2.2'/%3E%3Cpath d='M-6 -1.5H6L9.5 11H-9.5Z' fill='%232C3854'/%3E%3Ccircle cy='-5.5' r='3.8' fill='%232C3854'/%3E%3Cpath d='M-7.2 -7L-4.8 -8.8L1.2 -14.6L4.8 -8.8L7.2 -7Z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="map">
        <div id="bar">
          <div id="figures">
            <div id="res"></div>
            <div id="when">
              <span id="tick"></span>
              <span id="clock"></span>
            </div>
          </div>
          <div id="acts">
            <button id="panel-open" aria-controls="panel" aria-expanded="false">Stats</button>
          </div>
          <button id="side-toggle" aria-controls="panel" aria-expanded="true">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <rect x="1.7" y="2.7" width="12.6" height="10.6" rx="1.8" />
              <path class="pane" d="M10.2 2.7h2.3a1.8 1.8 0 0 1 1.8 1.8v7a1.8 1.8 0 0 1-1.8 1.8h-2.3z" />
            </svg>
          </button>
        </div>
        <div id="skipped"></div>
      </div>
      <aside id="panel">
        <button id="panel-close">Close ×</button>
        <div id="panel-head"></div>
        <div id="search">
          <input id="search-input" type="search" placeholder="Search a name to inspect" autocomplete="off" spellcheck="false" aria-label="Search a name to inspect" />
          <div id="search-results" hidden></div>
        </div>
        <div id="panel-body"></div>
      </aside>
      <div id="timeline">
        <div id="controls">
          <button id="play">Pause</button>
          <span id="speeds" class="group"></span>
          <button id="speed" title="Change speed"></button>
          <div id="more">
            <span id="days" class="group"></span>
            <select id="resolution" title="Map resolution: higher is sharper and slower"></select>
            <span id="toggles" class="group"></span>
          </div>
          <button id="more-toggle" aria-controls="more" aria-expanded="false">More</button>
        </div>
        <div id="scrubs">
          <canvas id="weeks" hidden></canvas>
          <canvas id="scrub"></canvas>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
